name: Deploy jukas canary

on:
  push:
    branches:
      - "canary"

env:
  APP_DIR: /opt/jukas/app
  APP_PORT: 3050

jobs:
  deploy:
    runs-on: jukas_runner

    steps:
      - name: Pull latest code
        run: |
          cd ${{ env.APP_DIR }}
          git fetch origin canary
          git reset --hard origin/canary

      - name: Install dependencies
        run: |
          cd ${{ env.APP_DIR }}
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          cd ${{ env.APP_DIR }}
          pnpm build

      - name: Restart service
        run: sudo systemctl restart jukas.service

      - name: Health check
        run: |
          echo "Waiting for app to start..."
          sleep 5
          curl -f http://localhost:${{ env.APP_PORT }} || exit 1
          echo "✅ Deployment successful!"
