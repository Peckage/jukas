name: Deploy jukas canary

on:
  push:
    branches:
      - "canary"

env:
  APP_PORT: 3050

jobs:
  deploy:
    runs-on: jukas_runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Restart service
        run: sudo systemctl restart jukas.service

      - name: Health check
        run: |
          echo "Waiting for app to start..."
          sleep 5
          curl -f http://localhost:${{ env.APP_PORT }} || exit 1
          echo "✅ Deployment successful!"
