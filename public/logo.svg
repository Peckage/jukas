<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="jGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Back card -->
  <g transform="rotate(-12, 60, 60)" filter="url(#shadow)">
    <rect x="25" y="15" width="70" height="90" rx="10" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="1.5"/>
    <rect x="30" y="20" width="60" height="80" rx="7" fill="none" stroke="#f97316" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.3"/>
    <path d="M60 30 L70 50 L60 70 L50 50 Z" fill="none" stroke="#f97316" stroke-width="1" opacity="0.25"/>
  </g>
  <!-- Front card -->
  <g transform="rotate(6, 60, 60)" filter="url(#shadow)">
    <rect x="25" y="15" width="70" height="90" rx="10" fill="#0f0f1a" stroke="url(#cardGrad1)" stroke-width="2"/>
    <rect x="29" y="19" width="62" height="82" rx="7" fill="none" stroke="url(#cardGrad2)" stroke-width="0.8"/>
    <text x="34" y="33" font-size="10" fill="#f97316" font-family="serif" opacity="0.9">♦</text>
    <text x="82" y="96" font-size="10" fill="#f97316" font-family="serif" opacity="0.9" transform="rotate(180, 86, 92)">♦</text>
    <text x="60" y="68" font-size="42" font-weight="800" fill="url(#jGrad)" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" filter="url(#glow)" letter-spacing="-1">J</text>
    <circle cx="75" cy="38" r="2" fill="#f97316" opacity="0.7"/>
    <circle cx="78" cy="35" r="1.2" fill="#fbbf24" opacity="0.5"/>
    <circle cx="73" cy="34" r="1" fill="#f97316" opacity="0.4"/>
  </g>
</svg>
